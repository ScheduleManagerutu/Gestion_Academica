<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Horarios creados</title>
  <!-- CSS de Bootstrap 5 (igual que la página de creación) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Mismo style.css que usa vista_creación-horarios.html -->
  <link rel="stylesheet" href="../style.css">
</head>
<body>

<div class="layout">

  <!-- Sidebar con los filtros -->
  <aside class="sidebar">
    <!-- Botón para volver al menú inicial -->
    <a href="index.php" class="btn-volver">← Volver al menú</a>

    <div class="seccion">
      <div class="seccion-titulo">TURNO</div>
      <div id="lista-turnos"></div>
    </div>

    <div class="seccion">
      <div class="seccion-titulo">GRUPO</div>
      <div id="lista-grupos"></div>
    </div>
  </aside>

  <!-- Contenido -->
  <main class="contenido">
    <div class="tabs">
      <div class="tab activo">HORARIOS GUARDADOS</div>
    </div>

    <div class="titulo-seccion">
      <div>
        <h2>Horarios creados</h2>
        <div class="subtitulo">Filtra por turno y grupo · Haz clic en "Ver grilla" para ver el horario completo</div>
      </div>
      <div class="badge-cursos" id="badge-horarios">0 horarios</div>
    </div>

    <!-- Botones -->
    <div class="barra-filtros">
      <button class="btn-limpiar" onclick="limpiarFiltros()">Limpiar filtros</button>
      <button class="btn-borrar" onclick="borrarFiltrados()">Borrar horarios del filtro</button>
    </div>

    <!-- Lista de horarios guardados -->
    <div class="curso-bloque">
      <div class="curso-header">
        <span class="nombre">Horarios guardados</span>
        <span class="flecha">▾</span>
      </div>

      <table class="tabla-lista">
        <thead>
          <tr>
            <th>NOMBRE</th>
            <th>TURNO</th>
            <th>GRUPO</th>
            <th>ALUMNOS</th>
            <th>CLASES</th>
            <th>ACCIONES</th>
          </tr>
        </thead>
        <tbody id="cuerpoTabla"></tbody>
      </table>
      <div id="mensaje" class="vacio"></div>
    </div>

    <!-- Aquí se muestra la grilla elegida -->
    <div id="detalle"></div>
  </main>

</div>


<script>
// Archivo PHP que habla con la base de datos (ajusta la ruta si hace falta)
var API = "../api_horarios.php";

var DIAS = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes"];

// Turnos disponibles (el valor es el mismo que se guarda en la base de datos)
var TURNOS = [
  { valor: "Matutino",   etiqueta: "Turno 1 (Matutino)" },
  { valor: "Vespertino", etiqueta: "Turno 3 (Vespertino)" },
  { valor: "Nocturno",   etiqueta: "Turno 5 (Nocturno)" }
];

// Horas de cada turno. Tienen que ser iguales a las de vista_creación-horarios.html
var FILAS_TURNO = {
  "Matutino": [
    { hora: "07:30 - 08:15", tipo: "clase" },
    { hora: "08:15 - 09:00", tipo: "clase" },
    { hora: "09:00 - 09:05", tipo: "receso" },
    { hora: "09:05 - 09:50", tipo: "clase" },
    { hora: "09:50 - 10:35", tipo: "clase" },
    { hora: "10:35 - 10:40", tipo: "receso" },
    { hora: "10:40 - 11:25", tipo: "clase" },
    { hora: "11:25 - 12:10", tipo: "clase" },
    { hora: "12:10 - 12:15", tipo: "receso" },
    { hora: "12:15 - 13:00", tipo: "clase" },
    { hora: "13:00 - 13:05", tipo: "receso" },
    { hora: "13:05 - 13:50", tipo: "clase" }
  ],
  "Vespertino": [
    { hora: "13:05 - 13:50", tipo: "clase" },
    { hora: "13:50 - 14:35", tipo: "clase" },
    { hora: "14:35 - 14:40", tipo: "receso" },
    { hora: "14:40 - 15:25", tipo: "clase" },
    { hora: "15:25 - 16:10", tipo: "clase" },
    { hora: "16:10 - 16:15", tipo: "receso" },
    { hora: "16:15 - 17:00", tipo: "clase" },
    { hora: "17:00 - 17:45", tipo: "clase" },
    { hora: "17:45 - 17:50", tipo: "receso" },
    { hora: "17:50 - 18:35", tipo: "clase" },
    { hora: "18:35 - 19:20", tipo: "clase" }
  ],
  "Nocturno": [
    { hora: "17:50 - 18:35", tipo: "clase" },
    { hora: "18:35 - 19:20", tipo: "clase" },
    { hora: "19:20 - 20:00", tipo: "clase" },
    { hora: "20:00 - 20:05", tipo: "receso" },
    { hora: "20:05 - 20:45", tipo: "clase" },
    { hora: "20:45 - 21:25", tipo: "clase" },
    { hora: "21:25 - 21:30", tipo: "receso" },
    { hora: "21:30 - 22:10", tipo: "clase" },
    { hora: "22:10 - 22:15", tipo: "receso" },
    { hora: "22:15 - 22:55", tipo: "clase" },
    { hora: "22:55 - 23:35", tipo: "clase" }
  ]
};

var horariosGuardados = [];   // cursos con horario guardado (vienen de la base de datos)
var listaCursos = [];         // nombres de curso sin repetir
var turnoElegido = "";        // "" significa "Todos"
var cursoElegido = "";        // "" significa "Todos"


// Cambia los símbolos < > & para que un texto raro no rompa la página
function limpiar(texto) {
  texto = String(texto);
  texto = texto.replace(/&/g, "&amp;");
  texto = texto.replace(/</g, "&lt;");
  texto = texto.replace(/>/g, "&gt;");
  return texto;
}


// ---------- COMUNICACIÓN CON LA BASE DE DATOS ----------

// Envía un pedido a api_horarios.php y devuelve la respuesta
function llamarApi(accion, datos) {
  var formData = new FormData();
  formData.append("accion", accion);
  for (var clave in datos) {
    formData.append(clave, datos[clave]);
  }

  return fetch(API, { method: "POST", body: formData })
    .then(function (respuesta) {
      return respuesta.json().catch(function () {
        throw new Error("El servidor no respondió como se esperaba. Revisa que api_horarios.php esté en la ruta correcta y que la página se abra desde el servidor (no como archivo).");
      });
    })
    .then(function (json) {
      if (!json.ok) {
        throw new Error(json.error);
      }
      return json;
    });
}

function mostrarError(error) {
  alert(error.message);
}

// Vuelve a leer los horarios de la base de datos y redibuja todo
function recargar() {
  llamarApi("listar_horarios", {})
    .then(function (datos) {
      horariosGuardados = datos.horarios;
      armarListaCursos();
      dibujarFiltros();
      mostrarTabla();
    })
    .catch(mostrarError);
}


// ---------- FILTROS ----------

// Arma la lista de cursos sin repetir
function armarListaCursos() {
  listaCursos = [];
  for (var i = 0; i < horariosGuardados.length; i++) {
    if (listaCursos.indexOf(horariosGuardados[i].curso) == -1) {
      listaCursos.push(horariosGuardados[i].curso);
    }
  }
  listaCursos.sort();

  // Si el curso elegido ya no existe, volver a "Todos"
  if (listaCursos.indexOf(cursoElegido) == -1) {
    cursoElegido = "";
  }
}

// Dibuja los filtros del sidebar
function dibujarFiltros() {
  // Turnos
  var html = "";
  var clase = "item-filtro";
  if (turnoElegido == "") { clase += " activo"; }
  html += '<div class="' + clase + '" onclick="elegirTurno(\'\')"><span class="bullet">●</span> Todos</div>';

  for (var i = 0; i < TURNOS.length; i++) {
    clase = "item-filtro";
    if (TURNOS[i].valor == turnoElegido) { clase += " activo"; }
    html += '<div class="' + clase + '" onclick="elegirTurno(\'' + TURNOS[i].valor + '\')">';
    html += '<span class="bullet">●</span> ' + TURNOS[i].etiqueta + '</div>';
  }
  document.getElementById("lista-turnos").innerHTML = html;

  // Grupos (cursos)
  html = "";
  clase = "item-filtro";
  if (cursoElegido == "") { clase += " activo"; }
  html += '<div class="' + clase + '" onclick="elegirGrupo(-1)"><span class="bullet">●</span> Todos</div>';

  for (var g = 0; g < listaCursos.length; g++) {
    clase = "item-filtro";
    if (listaCursos[g] == cursoElegido) { clase += " activo"; }
    html += '<div class="' + clase + '" onclick="elegirGrupo(' + g + ')">';
    html += '<span class="bullet">●</span> ' + limpiar(listaCursos[g]);
    // La × elimina el grupo (stopPropagation evita que cuente como clic en el grupo)
    html += '<span class="borrar" title="Eliminar grupo" onclick="event.stopPropagation(); borrarGrupo(' + g + ')">×</span>';
    html += '</div>';
  }
  document.getElementById("lista-grupos").innerHTML = html;
}

// Clic en un turno o en un grupo del sidebar
function elegirTurno(valor) {
  turnoElegido = valor;
  dibujarFiltros();
  mostrarTabla();
}

function elegirGrupo(indice) {
  if (indice < 0) {
    cursoElegido = "";
  } else {
    cursoElegido = listaCursos[indice];
  }
  dibujarFiltros();
  mostrarTabla();
}

// Dice si un horario cumple los filtros elegidos
function coincideFiltro(h) {
  // Si el filtro está en "Todos" (vacío), coincide siempre
  var turnoOk = (turnoElegido == "" || h.turno == turnoElegido);
  var cursoOk = (cursoElegido == "" || h.curso == cursoElegido);
  return turnoOk && cursoOk;
}

function limpiarFiltros() {
  turnoElegido = "";
  cursoElegido = "";
  dibujarFiltros();
  mostrarTabla();
}


// ---------- TABLA ----------

// Muestra en la tabla solo los horarios que cumplan los filtros
function mostrarTabla() {
  var filas = "";
  var cantidad = 0;

  for (var i = 0; i < horariosGuardados.length; i++) {
    var h = horariosGuardados[i];

    if (coincideFiltro(h)) {
      var turno = h.turno;
      if (turno == "") {
        turno = "Sin turno";
      }

      filas += "<tr>";
      filas += "<td>" + limpiar(h.nombre) + "</td>";
      filas += "<td>" + limpiar(turno) + "</td>";
      filas += "<td>" + limpiar(h.curso) + "</td>";
      filas += "<td>" + limpiar(h.cantidad) + "</td>";
      filas += "<td>" + limpiar(h.clases) + "</td>";
      filas += "<td>";
      filas += '<button class="btn-ver" onclick="verGrilla(' + i + ')">Ver grilla</button>';
      filas += '<button class="btn-borrar" onclick="borrarHorario(' + i + ')">Borrar</button>';
      filas += "</td>";
      filas += "</tr>";
      cantidad++;
    }
  }

  document.getElementById("cuerpoTabla").innerHTML = filas;

  // Contador de arriba
  if (cantidad == 1) {
    document.getElementById("badge-horarios").textContent = "1 horario";
  } else {
    document.getElementById("badge-horarios").textContent = cantidad + " horarios";
  }

  // Mensaje cuando no hay nada para mostrar
  if (horariosGuardados.length == 0) {
    document.getElementById("mensaje").textContent = "Todavía no hay horarios guardados.";
  } else if (cantidad == 0) {
    document.getElementById("mensaje").textContent = "No hay horarios con ese filtro.";
  } else {
    document.getElementById("mensaje").textContent = "";
  }

  cerrarDetalle();
}


// ---------- GRILLA COMPLETA ----------

// Pide las clases del horario a la base de datos y las muestra
function verGrilla(i) {
  var h = horariosGuardados[i];

  llamarApi("leer_grilla", { idgrupo: h.id })
    .then(function (datos) {
      dibujarDetalle(h, datos.clases);
    })
    .catch(mostrarError);
}

// Si el turno no se conoce, arma las filas con las horas que tienen clases
function armarFilasDesdeClases(clases) {
  var horas = [];
  for (var i = 0; i < clases.length; i++) {
    var hora = clases[i].inicio + " - " + clases[i].fin;
    if (horas.indexOf(hora) == -1) {
      horas.push(hora);
    }
  }
  horas.sort();

  var filas = [];
  for (var j = 0; j < horas.length; j++) {
    filas.push({ hora: horas[j], tipo: "clase" });
  }
  return filas;
}

function dibujarDetalle(h, clases) {
  // Guardar cada clase en un mapa: "Lunes|07:30 - 08:15" -> clase
  var mapa = {};
  for (var k = 0; k < clases.length; k++) {
    mapa[clases[k].dia + "|" + clases[k].inicio + " - " + clases[k].fin] = clases[k];
  }

  var filasDef = FILAS_TURNO[h.turno];
  if (!filasDef) {
    filasDef = armarFilasDesdeClases(clases);
  }

  // Fila de títulos (HORA + los días)
  var titulos = "<tr><th>HORA</th>";
  for (var d = 0; d < DIAS.length; d++) {
    titulos += "<th>" + limpiar(DIAS[d]).toUpperCase() + "</th>";
  }
  titulos += "</tr>";

  // Una fila por cada hora del turno
  var filas = "";
  var mostradas = 0;

  for (var f = 0; f < filasDef.length; f++) {
    var fila = filasDef[f];

    if (fila.tipo == "receso") {
      filas += '<tr class="receso">';
      filas += '<td class="hora">' + limpiar(fila.hora) + '</td>';
      filas += '<td colspan="' + DIAS.length + '">RECESO</td>';
      filas += '</tr>';
    } else {
      filas += '<tr>';
      filas += '<td class="hora">' + limpiar(fila.hora) + '</td>';
      for (var c = 0; c < DIAS.length; c++) {
        var clase = mapa[DIAS[c] + "|" + fila.hora];
        if (clase) {
          filas += '<td class="ocupada"><span>' + limpiar(clase.docente) + '</span>';
          if (clase.materia) {
            filas += '<small>' + limpiar(clase.materia) + '</small>';
          }
          filas += '</td>';
          mostradas++;
        } else {
          filas += '<td class="vacia"></td>';
        }
      }
      filas += '</tr>';
    }
  }

  var html = '<div class="curso-bloque">';
  html += '<div class="curso-header">';
  html += '<span class="nombre">' + limpiar(h.nombre) + '</span>';
  html += '<span class="horas-asignadas">' + mostradas + ' horas asignadas</span>';
  html += '<span class="flecha cerrar" onclick="cerrarDetalle()" title="Cerrar">✕</span>';
  html += '</div>';
  html += '<table class="grilla"><thead>' + titulos + '</thead><tbody>' + filas + '</tbody></table>';

  // Aviso si hay clases guardadas en horas que el turno no tiene
  if (mostradas < clases.length) {
    html += '<div class="vacio" style="padding:12px">' + (clases.length - mostradas) + ' clase(s) guardada(s) no coinciden con las horas de este turno y no se muestran.</div>';
  }
  html += '</div>';

  document.getElementById("detalle").innerHTML = html;
  document.getElementById("detalle").scrollIntoView();
}

function cerrarDetalle() {
  document.getElementById("detalle").innerHTML = "";
}


// ---------- BORRAR ----------

// Botón "Borrar" de una fila: borra el horario (las clases) de ese curso
function borrarHorario(i) {
  var h = horariosGuardados[i];
  var seguro = confirm("¿Borrar el horario \"" + h.nombre + "\" de la base de datos? No se puede deshacer.");
  if (!seguro) {
    return;
  }

  llamarApi("borrar_horarios", { ids: JSON.stringify([h.id]) })
    .then(recargar)
    .catch(mostrarError);
}

// Botón "Borrar horarios del filtro": borra todos los que se ven en la tabla
function borrarFiltrados() {
  var ids = [];
  for (var i = 0; i < horariosGuardados.length; i++) {
    if (coincideFiltro(horariosGuardados[i])) {
      ids.push(horariosGuardados[i].id);
    }
  }

  if (ids.length == 0) {
    alert("No hay horarios para borrar con este filtro.");
    return;
  }

  var mensaje = "¿Borrar " + ids.length + " horario(s) del filtro actual? No se puede deshacer.";
  if (turnoElegido == "" && cursoElegido == "") {
    mensaje = "No hay ningún filtro elegido: se borrarán TODOS los horarios guardados (" + ids.length + "). ¿Continuar?";
  }
  if (!confirm(mensaje)) {
    return;
  }

  llamarApi("borrar_horarios", { ids: JSON.stringify(ids) })
    .then(recargar)
    .catch(mostrarError);
}

// × de un grupo del sidebar: elimina el curso (en todos los turnos) y sus horarios
function borrarGrupo(indice) {
  var curso = listaCursos[indice];

  var ids = [];
  for (var i = 0; i < horariosGuardados.length; i++) {
    if (horariosGuardados[i].curso == curso) {
      ids.push(horariosGuardados[i].id);
    }
  }

  var seguro = confirm("¿Eliminar el grupo " + curso + " de la base de datos? Se borran el curso y sus " + ids.length + " horario(s) guardado(s). No se puede deshacer.");
  if (!seguro) {
    return;
  }

  llamarApi("borrar_grupos", { ids: JSON.stringify(ids) })
    .then(recargar)
    .catch(mostrarError);
}


// Al abrir la página: leer los horarios de la base de datos
recargar();
</script>

</body>
</html>
